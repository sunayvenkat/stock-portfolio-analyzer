<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Analyzer</title>
  <meta name="description" content="Value, performance, risk, optimization and Monte Carlo analysis for a stock portfolio, against the S&amp;P 500.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171721'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' fill='none' stroke='%239cb4e8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main">
      <div class="wordmark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#262634"/><path d="M7 21l6-6 4 4 8-9" fill="none" stroke="#9cb4e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Portfolio Analyzer
        <button class="btn ghost icon-btn close" type="button" aria-label="Close menu" style="margin-left:auto">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <nav>
        <div class="group-label">Portfolio</div>
        <a class="nav-item" href="#/overview" data-view="overview">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
          Overview</a>
        <a class="nav-item" href="#/performance" data-view="performance">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4-4 3 3 5-6"/><path d="M10 5h4v4"/></svg>
          Performance</a>
        <a class="nav-item" href="#/diversification" data-view="diversification">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 2v6l4.5 4"/></svg>
          Diversification</a>
        <a class="nav-item" href="#/optimization" data-view="optimization">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/><circle cx="6" cy="4" r="1.5" fill="var(--ground)"/><circle cx="10" cy="8" r="1.5" fill="var(--ground)"/><circle cx="5" cy="12" r="1.5" fill="var(--ground)"/></svg>
          Optimization</a>
        <a class="nav-item" href="#/simulation" data-view="simulation">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9c3 0 5-1 12-6M2 9c4 0 7 0 12 0M2 9c3 0 6 1 12 5"/></svg>
          Simulation</a>
        <a class="nav-item" href="#/holding" data-view="holding">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 4h8M5 8h8M5 12h8"/><circle cx="2.5" cy="4" r=".5"/><circle cx="2.5" cy="8" r=".5"/><circle cx="2.5" cy="12" r=".5"/></svg>
          Holdings</a>
        <div class="group-label">Settings</div>
        <a class="nav-item" href="#/edit" data-view="edit">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg>
          Edit holdings</a>
      </nav>
      <p class="bottom">Prices and news from Yahoo Finance. Past performance does not predict future results. Not investment advice.</p>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="btn ghost icon-btn menu-toggle" type="button" aria-label="Open menu" aria-controls="sidebar">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
        </button>
        <div class="summary" id="summary" aria-live="polite"></div>
        <div class="switcher">
          <a class="btn" href="#/edit">Edit holdings</a>
        </div>
      </header>
      <main class="canvas grid" id="canvas">
        <noscript><p>This dashboard needs JavaScript to draw its charts.</p></noscript>
      </main>
    </div>
  </div>
  <script>
    // Vercel Web Analytics; the hash route (#/holding/TICKER) is dropped so viewed tickers never leave the browser
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.va('beforeSend', function (event) { return Object.assign({}, event, { url: event.url.split('#')[0] }); });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
